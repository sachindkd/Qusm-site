name: Repair homepage JSX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair mismatched hero JSX closing tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '</div></div></motion.div><div className="scroll-cue">'
          new = '</div></motion.div><div className="scroll-cue">'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Target JSX pattern not found; no change needed.')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage hero JSX'
          git push
