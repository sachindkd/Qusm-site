name: NEXUS Build
on:
  push:
    branches: [nexus-bootstrap]
    paths:
      - 'nexus/**'
  pull_request:
    branches: [nexus-bootstrap]
    paths:
      - 'nexus/**'
jobs:
  nexus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
