name: Fix NEXUS response style
on:
  push:
    branches:
      - nexus-bootstrap
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexus-bootstrap
          fetch-depth: 0
      - name: Patch
        run: |
          python -c "from pathlib import Path; p=Path('nexus/core/ai-runtime.ts'); s=p.read_text(); s=s.replace('const MAX_GENERATION_TOKENS = 1800;', 'const MAX_GENERATION_TOKENS = 2400;'); s=s.replace(\"'You are NEXUS reporting an executed objective.'\", \"'You are NEXUS speaking directly to the user. Write only the final answer they should see, like a natural conversational AI assistant.'\"); s=s.replace(\"'Use ONLY supplied execution results as evidence. Do not invent facts or claim failed steps succeeded.'\", \"'Use only supplied evidence. Do not invent facts or claim failed actions succeeded.'\"); s=s.replace(\"'For investigations/public data, summarize verified facts and useful findings. For changes, state exactly what succeeded or failed. If evidence is incomplete, say so. Keep it useful for Discord.'\", \"'Never mention tools, capabilities, execution steps, plans, progress, statuses, internal state, raw results, or how you worked. Never use tables or an execution-report format. Never use headings such as Objective, Status, Progress, Authoritative Execution Results, or Findings. Do not list what you did. Just answer the user\'s request directly. For investigations, state the useful verified facts and risk assessment when supported. For changes, state the resulting change and any real remaining issue. Use natural paragraphs or simple factual bullets.'\"); p.write_text(s)"
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/core/ai-runtime.ts
          git commit -m 'Make NEXUS output conversational' || true
          rm -f .github/workflows/nexus-conversation-output-fix.yml
          git add -A
          git commit -m 'Remove temporary NEXUS response fix workflow' || true
          git push origin HEAD:nexus-bootstrap
