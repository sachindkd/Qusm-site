name: Repair homepage JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair hero wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          target = '<div className="card-caption"><span>FORT BLISS</span><strong>MILITARY ROLEPLAY</strong><span>COMMAND // COMMUNITY // OPERATIONS</span></div></motion.div><div className="scroll-cue">'
          if target in s:
              print('Hero JSX already repaired.')
          else:
              old = '<div className="card-caption"><span>FORT BLISS</span><strong>MILITARY ROLEPLAY</strong><span>COMMAND // COMMUNITY // OPERATIONS</span></div></div><div className="scroll-cue">'
              if old not in s:
                  raise SystemExit('Hero JSX target not found')
              p.write_text(s.replace(old, target, 1))
              print('Hero JSX repaired.')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Fix missing hero motion wrapper'
          git push
