name: Auto-fix TypeScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix division status typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'type DivisionEntry = { id: string; code: string; name: string; description: string; status: "active" | "inactive" | "temporary"; leadership?: string; logoUrl?: string; order?: number };'
          new = 'type DivisionEntry = { id: string; code: string; name: string; description: string; status: string; leadership?: string; logoUrl?: string; order?: number };'
          if old in s:
              p.write_text(s.replace(old, new))
          PY
      - name: Commit fix if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo 'No fix needed'
          else
            git commit -m 'Fix division status TypeScript error'
            git push
          fi
