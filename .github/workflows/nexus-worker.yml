name: NEXUS Discord Worker

on:
  workflow_dispatch:
  push:
    branches:
      - nexus-bootstrap

permissions:
  actions: write
  contents: read

concurrency:
  group: nexus-discord-worker
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4
        with:
          ref: nexus-bootstrap

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NEXUS dependencies
        working-directory: nexus
        run: npm install --omit=optional

      - name: Run Discord Gateway worker
        working-directory: nexus
        env:
          NEXUS_DISCORD_BOT_TOKEN: ${{ secrets.NEXUS_DISCORD_BOT_TOKEN }}
          NEXUS_GEMINI_API_KEY: ${{ secrets.NEXUS_GEMINI_API_KEY }}
          NEXUS_AI_ROUTINE_MODEL: gemini-2.5-flash
          NEXUS_AI_REASONING_MODEL: gemini-2.5-flash
          NEXUS_ALLOWED_GUILD_ID: '1549377442240663572'
          NEXUS_ALLOWED_ROLE_ID: '1549378437448335380'
        run: |
          npm run worker &
          WORKER_PID=$!
          sleep 20700
          kill $WORKER_PID || true
          wait $WORKER_PID || true

      - name: Queue the next worker session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/nexus-worker.yml/dispatches \
            -d '{"ref":"nexus-bootstrap"}'
