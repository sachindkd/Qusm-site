name: Patch NEXUS conversational output
on:
  push:
    branches: [nexus-bootstrap]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexus-bootstrap
          fetch-depth: 0
      - name: Rewrite execution response prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('nexus/core/ai-runtime.ts')
          s = p.read_text()
          s = s.replace('const MAX_GENERATION_TOKENS = 1800;', 'const MAX_GENERATION_TOKENS = 2400;')
          pattern = r"export async function generateExecutionReport\(goal: string, guildId: string, userId: string, plan: DynamicExecutionPlan, results: unknown\[\]\): Promise<string> \{.*?\n\}\n\nfunction validatePlan"
          replacement = '''export async function generateExecutionReport(goal: string, guildId: string, userId: string, plan: DynamicExecutionPlan, results: unknown[]): Promise<string> {
  const report = await generate([
    'You are NEXUS speaking directly to the user after completing a requested task.',
    'Write ONLY the final answer the user should see, exactly like a capable conversational AI assistant.',
    'Answer the user\'s request directly. Do not explain how you worked.',
    'Never mention execution steps, capabilities, tools, planners, plans, progress counts, internal state, raw result objects, or implementation details.',
    'Never use tables or an execution report format.',
    'Never use headings like NEXUS Execution Report, Objective, Status, Progress, Authoritative Execution Results, Findings, or similar process headings.',
    'Do not list what you did. Do not say step 1, step 2, completed, 4/4, or describe the tool calls.',
    'For investigations, simply tell the user the relevant facts you found, any meaningful activity, and a risk assessment when the evidence supports one.',
    'For changes, simply say what changed and the resulting state. Mention a problem only if something actually remains unresolved.',
    'Use natural language and concise paragraphs. Simple bullets are allowed only for the actual facts the user asked for.',
    'Do not invent missing evidence. If something could not be established, say that naturally.',
    `User request: ${goal}`,
    `Verified evidence: ${JSON.stringify(results)}`,
  ].join('\\n\\n');
  remember(guildId, userId, 'user', goal); remember(guildId, userId, 'assistant', report); return report;
}

function validatePlan'''
          ns, count = re.subn(pattern, replacement, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one generateExecutionReport block, found {count}')
          p.write_text(ns)
          PY
      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/core/ai-runtime.ts
          git commit -m 'Make NEXUS responses direct and conversational' || true
          rm -f .github/workflows/nexus-conversation-output.yml
          git add .github/workflows/nexus-conversation-output.yml
          git commit -m 'Remove temporary NEXUS output patch workflow' || true
          git push origin HEAD:nexus-bootstrap
